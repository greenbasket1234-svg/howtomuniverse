[build]
builder = "NIXPACKS"

[deploy]
# Railway 컨테이너가 8GB RAM으로 설정되어 있는데, Node/V8의 기본 힙 한계는 이를 반영하지
# 않고 약 2GB로 잡힙니다. --max-old-space-size로 실제 여유 메모리에 맞게 올려서, 대형
# 계정(캠페인/키워드를 개별 조회하는 계정) 동기화가 불필요하게 일찍 끊기지 않도록 합니다.
# 6144MB(6GB)로 설정해 나머지 ~2GB는 OS·네트워크 버퍼·V8 비-힙 메모리(external/buffers)용으로 남겨둡니다.
startCommand = "node --max-old-space-size=6144 server.mjs"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
